# Templates cloned into every new project.
# Each uses the team member's own git login (gh auth / SSH key / credential helper).
# Environment variables override any of these for a single run.

# Branches: every one of these repos is on master today. Leave a branch empty to
# follow whatever the repo's default branch is, which is the safer choice if a
# repo is ever renamed to main - new-project.sh never guesses between the two.
#
# Application template: frontend, backend and shared, plus the software it needs.
: "${APP_TEMPLATE_REPO:=https://github.com/sundaramkumar/application-template.git}"
: "${APP_TEMPLATE_BRANCH:=master}"

# Knowledge wiki: markdown pages plus the builders that render wiki/index.html.
: "${WIKI_TEMPLATE_REPO:=https://github.com/sundaramkumar/llm-wiki-template.git}"
: "${WIKI_TEMPLATE_BRANCH:=master}"

# Wiki profile, one of the files in the wiki template's profiles/ folder:
# web-app, monolith, mobile-app, data-pipeline, infrastructure, library.
# Projects built from the application template are web-app.
: "${WIKI_PROFILE:=web-app}"
